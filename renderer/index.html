<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Token Framer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="frames" hidden>
      <div class="fhead"><strong>Recent frames</strong></div>
      <div id="frameList"></div>
    </aside>
    <section id="left">
      <div id="toolbar">
        <span class="tlabel">Image</span>
        <button id="btnImages" title="Pick one or more images">Open Images…</button>
        <button id="btnFolder" title="Pick a folder; every image without Token/Frame in its name is listed">Open Folder…</button>
        <span class="sep"></span>
        <span class="tlabel">Frame</span>
        <button id="btnFrame" title="Pick a frame image">Open Frame…</button>
        <button id="btnFrames" title="Show or hide the list of recent frames (the default frame is always at the top)">Recent Frames</button>
        <span id="frameName" class="muted">no frame</span>
        <span class="grow"></span>
        <label class="check" title="Show the preview without smoothing, so zoomed-in pixels are sharp blocks"><input type="checkbox" id="pixelView"> Pixel view</label>
      </div>
      <div id="holeStatus" class="notice" hidden></div>
      <div id="viewWrap">
        <div id="view">
          <canvas id="preview" width="800" height="800"></canvas>
          <div id="brushRing" hidden></div>
          <div id="rubber" hidden></div>
          <span id="zoomBadge" hidden></span>
        </div>
        <div id="dropHint">Drop images or a folder here</div>
      </div>
      <div id="statusBar">
        <progress id="prog" hidden max="1" value="0"></progress>
        <span id="status"></span>
        <button id="btnShow" hidden>Show in folder</button>
      </div>
      <div id="batchBar" hidden>
        <span id="batchCount"></span>
        <button id="btnAll">Select all</button>
        <button id="btnNone">Select none</button>
      </div>
      <div id="grid" hidden></div>
    </section>
    <aside id="right">
      <div id="editOnlyRow">
        <label class="check" id="editOnlyLabel" hidden><input type="checkbox" id="editOnly"> Edit this image only</label>
        <span class="rowbtns">
          <button id="btnResetImg" hidden title="Drop this image's overrides and use the shared settings">Reset image</button>
          <button id="btnDefaults" title="Reset every setting to its default">Reset settings</button>
        </span>
      </div>
      <div id="panel"></div>
      <div id="actions">
        <button id="btnSave" class="primary">Save token</button>
        <button id="btnSaveAs">Save as…</button>
        <button id="btnFrameAll" class="primary" hidden title="Apply the current settings to every ticked image and save each as '&lt;name&gt; Token.webp'">Save all</button>
        <button id="btnZip" hidden title="Render every ticked image and save them together as one .zip of '&lt;name&gt; Token.webp' files">Save all as ZIP</button>
      </div>
    </aside>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
